<!-- frontend/src/app/layouts/header/header.component.html -->
<nav class="navbar ">
  <ul>

    <li><a [routerLink]="['/about']" routerLinkActive="active">Sobre el proyecto</a></li>
  </ul>
  <div class="autor-section">
    <div class="user-info" *ngIf="isLoggedIn(); else loginLink">
      Hola, {{ auth.getUser()?.name }}
      <button (click)="logout()" class="btn btn-danger">Logout</button>
      <button [routerLink]="['/panel/autor/comics']" class="btn btn-primary">Panel de autor</button>

    </div>
    
    <ng-template #loginLink>
      <a class="btn btn-yellow" [routerLink]="['/login']">Login</a>
    </ng-template>
  </div>
</nav>
<header class="header">

  <img class="logo" src="/images/logo.gif" alt="">
</header>
<nav class="navbar fanzines">
  <ul>
    <li><a [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-zines-button active">Zines</a></li>
    <li><a [routerLink]="['/autores']" routerLinkActive="active" class="nav-zines-button">Autores</a></li>
  </ul>
</nav>
